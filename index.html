<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Morfemusta Adası</title>
    <meta
      name="description"
      content="Kök ve ek yaratıklarıyla kelime büyüsü: ilkokul çocukları için Türkçe biçimbilim oyunu."
    />
    <meta name="theme-color" content="#FFF6E9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Morfemusta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="kok"></div>
    <!-- Eski tarayıcı uyarısı: oyun açılamazsa (ES modülü yok, paket ayrıştırılamadı ya da
         yüklenemedi) beyaz ekran yerine bu çıkar. Satır içi stil: tarayıcı CSS değişkenlerini
         bilmeyebilir. -->
    <div
      id="eski-tarayici"
      role="alert"
      hidden
      style="max-width: 30rem; margin: 3rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; font-size: 1.25rem; line-height: 1.4; text-align: center"
    >
      <p>Bu tarayıcı Morfemusta için çok eski.</p>
      <p><a href="cihaz.html">Cihazı denetle</a></p>
    </div>
    <noscript>Morfemusta Adası'na girmek için JavaScript açık olmalı.</noscript>
    <script>
      // Yalnız ES5: her tarayıcıda çalışır. Oyunun modülü çalışmaya başlayınca kökte
      // data-acildi olur (src/main.tsx). ES modülü yoksa uyarı hemen; varsa sayfa yüklenince
      // (load: modüller ondan önce çalışır) oyun başlamadıysa çıkar.
      ;(function () {
        function uyar() {
          if (document.documentElement.getAttribute('data-acildi') !== null) return
          var uyari = document.getElementById('eski-tarayici')
          if (!uyari) return
          uyari.removeAttribute('hidden')
          uyari.style.display = 'block'
        }
        if (!('noModule' in document.createElement('script'))) {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', uyar)
          } else {
            uyar()
          }
          return
        }
        window.addEventListener('load', uyar)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
